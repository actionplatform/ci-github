name: Git-flow
description: "Fail when the PR does not follow git-flow: branch name <kind>/<code>, and feature/bugfix → develop, release/hotfix → main + develop."

inputs:
  head:
    description: Source branch (default the PR head)
    required: false
    default: ${{ github.head_ref }}
  base:
    description: Target branch (default the PR base)
    required: false
    default: ${{ github.base_ref }}
  default_branch:
    description: Repository default branch
    required: false
    default: ${{ github.event.repository.default_branch }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      run: |
        dir="$RUNNER_TEMP/ap-scripts"
        mkdir -p "$dir"
        for s in gitflow gitflow-pr; do
          curl -fsSL "https://raw.githubusercontent.com/actionplatform/ci-scripts/v1/$s.sh" -o "$dir/$s.sh"
        done
        chmod +x "$dir"/*.sh
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        AP_HEAD: ${{ inputs.head }}
        AP_BASE: ${{ inputs.base }}
        AP_DEFAULT_BRANCH: ${{ inputs.default_branch }}
      run: "${{ steps.fetch.outputs.dir }}/gitflow-pr.sh"
